<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>RouteScan</title>
<style>
  :root{
    --bg:#EEF2F4; --panel:#FFFFFF; --ink:#101820; --muted:#5B6770; --line:#D3DADF;
    --amber:#FFB400; --amber-ink:#101820; --teal:#0E7C7B; --red:#B3261E;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
  body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  header{padding:14px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
  #summary{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
  .scanner{margin:0 12px;background:var(--ink);border-radius:14px;overflow:hidden;position:relative;min-height:64px}
  #reader{width:100%}
  #reader video{border-radius:0}
  .scanner .idle{display:none;color:#C9D2D8;padding:20px 16px;font-size:15px;line-height:1.4}
  .scanner.off .idle{display:block}
  .scanner.off #reader{display:none}
  .row{display:flex;gap:8px;margin:10px 12px 6px}
  button{font:inherit;border:0;border-radius:12px;padding:14px 16px;font-weight:700;min-height:48px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  .btn-main{background:var(--amber);color:var(--amber-ink);flex:1}
  .btn-sub{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .btn-main:disabled{background:#E3E7EA;color:#8A949B}
  ul{list-style:none;margin:8px 12px 0;padding:0;display:grid;gap:8px}
  li{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:52px 1fr auto;align-items:center;min-height:64px}
  .num{font-size:30px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .info{padding:10px 4px;min-width:0}
  .label{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .meta.err{color:var(--red)}
  .acts{display:flex;gap:4px;padding-right:8px}
  .acts button{min-height:44px;min-width:44px;padding:0 10px;background:transparent;color:var(--ink);font-size:14px}
  .acts .done{background:#E4F2F1;color:var(--teal)}
  .tag{font-size:13px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .tag.ok{color:var(--teal)} .tag.tight{color:#8A5F00} .tag.late{color:var(--red)}
  li.late{border-color:var(--red);border-width:2px}
  li.isdone{opacity:.55}
  li.isdone .label{text-decoration:line-through}
  li.pending .num{color:var(--muted)}
  .empty{margin:28px 24px;color:var(--muted);line-height:1.5;font-size:15px}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(238,242,244,.96);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .bar .btn-main{font-size:17px;min-height:56px}
  .bar small{display:block;font-weight:500;font-size:12px;opacity:.8}
  #toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:5}
  #toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>RouteScan</h1>
  <div id="summary"></div>
</header>

<div class="scanner off" id="scanner">
  <div class="idle">Camera is off. Tap “Start scanning”, then hold each parcel’s QR code in view. Stops are added and ordered for you.</div>
  <div id="reader"></div>
</div>

<div class="row">
  <button class="btn-main" id="scanBtn">Start scanning</button>
  <button class="btn-sub" id="clockBtn" hidden>Restart clock</button>
  <button class="btn-sub" id="clearBtn">Clear all</button>
</div>

<ul id="list"></ul>
<div class="empty" id="empty">No stops yet. Scan a QR code to add the first delivery.</div>

<div class="bar">
  <button class="btn-main" id="navBtn" disabled>Start route</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'routescan_v1';
  const MAX_PER_LINK = 10;            // Google Maps link: 9 waypoints + 1 destination
  const OSRM = 'https://router.project-osrm.org/trip/v1/driving/';

  let state = load();
  let qr = null, scanning = false, optTimer = null, optRun = 0;
  const badSeen = new Map();

  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.stops) return Object.assign({ startedAt: null, etas: {}, optAt: null }, s); } catch (e) {}
    return { stops: [], order: [], summary: null, startedAt: null, etas: {}, optAt: null };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- feedback ---------- */
  let toastT;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }
  let actx;
  function beep() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; g.gain.value = 0.08;
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.12);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(80);
  }

  /* ---------- parsing ---------- */
  function parseCoords(raw) {
    let s = raw;
    try { s = decodeURIComponent(raw); } catch (e) {}
    let m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)
         || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)
         || s.match(/[?&](?:q|query|ll|destination|daddr|center)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/i)
         || s.match(/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);
    return m ? { lat: +m[1], lng: +m[2] } : null;
  }
  function labelFromUrl(raw) {
    try {
      const m = decodeURIComponent(raw).match(/\/maps\/place\/([^/@?]+)/);
      if (m) return m[1].replace(/\+/g, ' ');
      const q = new URL(raw).searchParams.get('q');
      if (q && !/^-?\d/.test(q)) return q;
    } catch (e) {}
    return '';
  }
  const isCandidate = t => /^https?:\/\//i.test(t) || /^\s*-?\d+\.\d+\s*,\s*-?\d+\.\d+\s*$/.test(t);

  async function geocode(q) {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (!j[0]) throw new Error('not found');
    return { lat: +j[0].lat, lng: +j[0].lon };
  }
  async function resolve(raw) {
    const local = parseCoords(raw);
    if (local) return { ...local, label: labelFromUrl(raw) };
    const r = await fetch('/api/resolve?url=' + encodeURIComponent(raw));
    if (!r.ok) throw new Error('resolve failed');
    const j = await r.json();
    if (j.lat != null) return { lat: j.lat, lng: j.lng, label: j.label || '' };
    if (j.query) { const g = await geocode(j.query); return { ...g, label: j.query }; }
    throw new Error('no location');
  }

  /* ---------- stops ---------- */
  async function addStop(raw) {
    const stop = { id: 's' + Date.now() + Math.random().toString(36).slice(2, 5), raw, lat: null, lng: null, label: '', status: 'pending', done: false };
    state.stops.push(stop); save(); render(); beep();
    try {
      const r = await resolve(raw);
      Object.assign(stop, r, { status: 'ok' });
      if (!stop.label) stop.label = r.lat.toFixed(4) + ', ' + r.lng.toFixed(4);
    } catch (e) {
      stop.status = 'error';
    }
    save(); render(); scheduleOptimize();
  }
  function onScan(text) {
    text = (text || '').trim();
    if (!text || state.stops.some(s => s.raw === text)) return;
    if (!isCandidate(text)) {
      const now = Date.now();
      if (now - (badSeen.get(text) || 0) > 4000) { toast('Not a map link, skipped'); }
      badSeen.set(text, now); return;
    }
    addStop(text);
  }

  /* ---------- optimize ---------- */
  function getStart() {
    return new Promise(res => {
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(
        p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
        () => res(null), { timeout: 8000, maximumAge: 60000 });
    });
  }
  function scheduleOptimize() { clearTimeout(optTimer); optTimer = setTimeout(optimize, 1500); }

  const LIMIT_MS = 40 * 60e3;   // each order must be delivered within 40 min of Start route
  const STOP_MS = 2 * 60e3;     // time spent at each stop (parking, handover); change if needed
  function timing(s, k) {
    if (!state.startedAt || !state.optAt || state.optAt < state.startedAt || state.etas[s.id] == null) return null;
    const arrive = state.optAt + state.etas[s.id] * 1000 + k * STOP_MS;
    return { arrive, margin: state.startedAt + LIMIT_MS - arrive };
  }
  function warnLate() {
    const n = activeStops().filter((s, k) => { const t = timing(s, k); return t && t.margin < 0; }).length;
    if (!n) return;
    toast(n + (n === 1 ? ' stop may' : ' stops may') + ' miss the 40-min limit');
    if (navigator.vibrate) navigator.vibrate([120, 80, 120]);
  }

  async function optimize() {
    const run = ++optRun;
    const pts = state.stops.filter(s => s.status === 'ok' && !s.done);
    const fallback = () => { state.order = pts.map(s => s.id); state.summary = null; state.etas = {}; save(); render(); };
    if (!pts.length) return fallback();
    const start = await getStart();
    if (run !== optRun) return;
    const coords = (start ? [start] : []).concat(pts);
    if (coords.length < 2) return fallback();
    const url = OSRM + coords.map(c => c.lng + ',' + c.lat).join(';') +
      '?roundtrip=false&source=first&destination=any&overview=false';
    try {
      const r = await fetch(url);
      const j = await r.json();
      if (run !== optRun) return;
      if (j.code !== 'Ok') throw new Error(j.code);
      const offset = start ? 1 : 0;
      const ordered = pts.map((p, i) => ({ id: p.id, pos: j.waypoints[i + offset].waypoint_index }))
                         .sort((a, b) => a.pos - b.pos).map(x => x.id);
      state.order = ordered;
      const t = j.trips[0];
      state.summary = { km: t.distance / 1000, min: t.duration / 60 };
      const legs = t.legs.map(l => l.duration);
      let acc = 0; const etas = {};
      ordered.forEach((id, k) => { const li = start ? k : k - 1; if (li >= 0) acc += legs[li]; etas[id] = acc; });
      state.etas = etas; state.optAt = Date.now();
      save(); render(); warnLate();
    } catch (e) {
      if (run !== optRun) return;
      fallback();
      toast('Could not optimize, using scan order');
    }
  }

  /* ---------- navigate ---------- */
  function activeStops() {
    const byId = new Map(state.stops.map(s => [s.id, s]));
    const ordered = state.order.map(id => byId.get(id)).filter(s => s && s.status === 'ok' && !s.done);
    const rest = state.stops.filter(s => s.status === 'ok' && !s.done && !state.order.includes(s.id));
    return ordered.concat(rest);
  }
  function navigate() {
    const act = activeStops();
    if (!act.length) return;
    const batch = act.slice(0, MAX_PER_LINK);
    const dest = batch[batch.length - 1];
    const way = batch.slice(0, -1).map(s => s.lat + ',' + s.lng).join('|');
    let url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + dest.lat + ',' + dest.lng;
    if (way) url += '&waypoints=' + encodeURIComponent(way);
    window.open(url, '_blank');
  }

  /* ---------- render ---------- */
  function render() {
    const act = activeStops();
    const actIds = new Map(act.map((s, i) => [s.id, i + 1]));
    const done = state.stops.filter(s => s.done);
    const other = state.stops.filter(s => s.status !== 'ok' && !s.done);
    const list = act.concat(other, done);

    $('#list').innerHTML = list.map(s => {
      const n = actIds.get(s.id);
      const cls0 = s.done ? 'isdone' : (s.status === 'pending' ? 'pending' : '');
      const t = n ? timing(s, n - 1) : null;
      const cls = cls0 + (t && t.margin < 0 ? ' late' : '');
      const tag = t ? (t.margin < 0 ? ['late', 'Late by ' + Math.ceil(-t.margin / 60000) + ' min']
        : [t.margin < 5 * 60e3 ? 'tight' : 'ok', new Date(t.arrive).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · ' + Math.floor(t.margin / 60000) + ' min spare']) : null;
      const meta = s.status === 'pending' ? 'Finding location…'
        : s.status === 'error' ? 'Location not found. Remove and rescan.' : (s.done ? 'Delivered' : '');
      return `<li class="${cls}" data-id="${s.id}">
        <div class="num">${n ?? (s.done ? '✓' : '·')}</div>
        <div class="info"><div class="label">${esc(s.label || 'New stop')}</div>${meta ? `<div class="meta ${s.status === 'error' ? 'err' : ''}">${meta}</div>` : ''}${tag ? `<div class="tag ${tag[0]}">${tag[1]}</div>` : ''}</div>
        <div class="acts">
          ${s.status === 'ok' ? `<button class="done" data-act="done" aria-label="${s.done ? 'Undo delivered' : 'Mark delivered'}">${s.done ? 'Undo' : 'Done'}</button>` : ''}
          <button data-act="del" aria-label="Remove stop">✕</button>
        </div></li>`;
    }).join('');

    $('#empty').style.display = state.stops.length ? 'none' : 'block';
    const sm = state.summary;
    let txt = act.length
      ? act.length + (act.length === 1 ? ' stop' : ' stops') + (sm ? ' · ' + Math.round(sm.min) + ' min · ' + sm.km.toFixed(1) + ' km' : '')
      : '';
    if (state.startedAt && act.length) {
      const left = Math.ceil((state.startedAt + LIMIT_MS - Date.now()) / 60000);
      txt += ' · ' + (left > 0 ? left + ' min on clock' : 'over 40 min');
    }
    $('#summary').textContent = txt;
    $('#clockBtn').hidden = !state.startedAt;
    const nb = $('#navBtn');
    nb.disabled = !act.length;
    if (!state.startedAt) nb.innerHTML = 'Start route<small>40-minute clock starts now</small>';
    else if (act.length > MAX_PER_LINK) nb.innerHTML = `Navigate next ${MAX_PER_LINK} stops<small>${act.length - MAX_PER_LINK} more after these</small>`;
    else nb.textContent = 'Navigate in Google Maps';
  }

  $('#list').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const id = b.closest('li').dataset.id, act = b.dataset.act;
    if (act === 'del') { state.stops = state.stops.filter(s => s.id !== id); state.order = state.order.filter(x => x !== id); }
    if (act === 'done') { const s = state.stops.find(x => x.id === id); s.done = !s.done; }
    save(); render(); scheduleOptimize();
  });
  $('#navBtn').addEventListener('click', () => {
    if (!state.startedAt) { state.startedAt = Date.now(); save(); render(); optimize(); }
    navigate();
  });
  $('#clockBtn').addEventListener('click', () => {
    if (!confirm('Restart the 40-minute clock now?')) return;
    state.startedAt = Date.now(); save(); render(); optimize();
  });
  $('#clearBtn').addEventListener('click', () => {
    if (!state.stops.length || !confirm('Remove all stops?')) return;
    state = { stops: [], order: [], summary: null, startedAt: null, etas: {}, optAt: null }; save(); render();
  });

  /* ---------- scanner ---------- */
  async function startScan() {
    try {
      qr = qr || new Html5Qrcode('reader');
      $('#scanner').classList.remove('off');
      await qr.start({ facingMode: 'environment' },
        { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
        onScan, () => {});
      scanning = true; $('#scanBtn').textContent = 'Stop scanning';
    } catch (e) {
      $('#scanner').classList.add('off');
      toast('Camera blocked. Allow camera access in browser settings.');
    }
  }
  async function stopScan() {
    try { if (qr && scanning) await qr.stop(); } catch (e) {}
    scanning = false; $('#scanner').classList.add('off'); $('#scanBtn').textContent = 'Start scanning';
  }
  $('#scanBtn').addEventListener('click', () => scanning ? stopScan() : startScan());

  setInterval(render, 30000);                                   // keep the clock and spare minutes fresh
  setInterval(() => { if (state.startedAt && activeStops().length) optimize(); }, 120000); // re-plan from live GPS
  render();
  if (state.stops.some(s => s.status === 'pending')) { state.stops.forEach(s => { if (s.status === 'pending') s.status = 'error'; }); save(); render(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
